<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Predictor</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1 id="app-title">⚽ Football Predictor</h1>
      <div class="api-status">
        <span id="api-badge" class="hidden">Chargement...</span>
        <span id="account-status"></span>
      </div>
    </div>
    <div class="sport-tabs" id="sport-tabs">
      <button class="sport-tab active" data-sport="football">⚽ Football</button>
      <button class="sport-tab" data-sport="nfl">🏈 NFL</button>
      <button class="sport-tab" data-sport="nba">🏀 Basketball</button>
      <button class="sport-tab" data-sport="hockey">🏒 Hockey</button>
      <button class="sport-tab" data-sport="baseball">⚾ Baseball</button>
      <button class="sport-tab" data-sport="handball">🤾 Handball</button>
      <button class="sport-tab" data-sport="tennis">🎾 Tennis</button>
      <button class="sport-tab" data-sport="combos">🎯 Combinés</button>
    </div>
  </header>

  <main>
    <div class="controls">
      <button id="btn-day-prev" class="hidden" title="Jour précédent">◀</button>
      <input type="date" id="date-picker" />
      <button id="btn-day-next" class="hidden" title="Jour suivant">▶</button>
      <button id="btn-load">Analyser</button>
      <input type="text" id="search-input" placeholder="🔍 Rechercher une équipe (ex: Brésil, Maroc, Pays-Bas...)" />
      <button id="btn-search">Rechercher</button>
    </div>

    <div id="search-results" class="hidden"></div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Analyse en cours... (peut prendre quelques secondes)</p>
    </div>

    <div id="error-box" class="hidden"></div>

    <div class="top-filters hidden" id="state-filters">
      <span class="filter-label">Statut :</span>
      <button class="filter-btn active" data-state="all">Tous</button>
      <button class="filter-btn" data-state="upcoming">⏳ À venir</button>
      <button class="filter-btn" data-state="live">🔴 En cours</button>
      <button class="filter-btn" data-state="finished">✅ Terminés</button>
    </div>

    <div class="top-filters hidden" id="top-filters">
      <span class="filter-label">Afficher :</span>
      <button class="filter-btn active" data-n="0">Tous</button>
      <button class="filter-btn" data-n="10">Top 10</button>
      <button class="filter-btn" data-n="5">Top 5</button>
      <button class="filter-btn" data-n="3">Top 3</button>
      <button class="filter-btn" data-n="2">Top 2</button>
    </div>

    <div id="predictions-grid"></div>

    <!-- Emplacement bannière AdSense — à remplacer par le <ins class="adsbygoogle"> réel une
         fois le compte approuvé (voir css/style.css .ad-banner-placeholder) -->
    <div class="ad-banner-placeholder">Emplacement publicitaire (bannière)</div>
  </main>

  <div id="modal" class="hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-box">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/matchModal.js"></script>
  <script src="/js/ads.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
