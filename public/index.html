<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Predictor</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>⚽ Football Predictor</h1>
      <div class="api-status">
        <span id="api-badge">Chargement...</span>
      </div>
    </div>
  </header>

  <main>
    <div class="controls">
      <input type="date" id="date-picker" />
      <button id="btn-load">Analyser</button>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Analyse en cours... (peut prendre quelques secondes)</p>
    </div>

    <div id="error-box" class="hidden"></div>

    <div id="predictions-grid"></div>
  </main>

  <div id="modal" class="hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-box">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
