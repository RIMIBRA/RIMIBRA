<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — footpredictongoal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/legal.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <h1>🔑 Mot de passe oublié</h1>
      <p style="color:var(--muted);font-size:0.85rem;margin-bottom:1.25rem;text-align:center">
        Indique ton email, on t'envoie un lien pour choisir un nouveau mot de passe.
      </p>

      <form id="forgot-form" class="auth-form">
        <input type="email" id="forgot-email" placeholder="Email" required autocomplete="email">
        <button type="submit">Envoyer le lien</button>
      </form>

      <p id="forgot-error" class="auth-error hidden"></p>
      <p id="forgot-success" class="auth-success hidden"></p>
      <a href="/login.html" class="auth-skip">← Retour à la connexion</a>
    </div>
  </div>

  <footer class="disclaimer-banner">
    <a href="/mentions-legales.html">Mentions légales</a>
    · <a href="/politique-confidentialite.html">Politique de confidentialité</a>
  </footer>

  <script src="/js/auth.js"></script>
  <script src="/js/forgotPassword.js"></script>
  <script src="/js/analytics.js"></script>
</body>
</html>
