<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — footpredictongoal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/legal.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <h1>🔑 Nouveau mot de passe</h1>

      <form id="reset-form" class="auth-form hidden">
        <input type="password" id="reset-password" placeholder="Nouveau mot de passe (8 caractères min.)" required autocomplete="new-password" minlength="8">
        <input type="password" id="reset-password-confirm" placeholder="Confirme le mot de passe" required autocomplete="new-password" minlength="8">
        <button type="submit">Valider</button>
      </form>

      <p id="reset-invalid" class="auth-error hidden">
        Ce lien est invalide ou a expiré. <a href="/forgot-password.html">Refais une demande</a>.
      </p>
      <p id="reset-error" class="auth-error hidden"></p>
      <a href="/login.html" class="auth-skip">← Retour à la connexion</a>
    </div>
  </div>

  <footer class="disclaimer-banner">
    <a href="/mentions-legales.html">Mentions légales</a>
    · <a href="/politique-confidentialite.html">Politique de confidentialité</a>
  </footer>

  <script src="/js/auth.js"></script>
  <script src="/js/resetPassword.js"></script>
  <script src="/js/analytics.js"></script>
</body>
</html>
